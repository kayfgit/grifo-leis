name: Atualizar leis

# Every Monday: download all laws from planalto.gov.br, convert them and publish those that pass the checks.
# A law that fails keeps its previous version; an issue lists what failed and why.
# Synced from the Grifo app repo (scripts/laws/data-repo/update.yml) by `npm run laws:sync`.
on:
  schedule:
    - cron: "0 9 * * 1" # 06:00 in Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools
      - name: Download pages
        run: node tools/fetch-laws.mjs .work/raw
      - name: Convert
        run: node tools/build-laws.mjs .work/raw .work/out || true
      - name: Check and publish
        id: publish
        run: node tools/publish.mjs .work/out . .work/report.md
      - run: cat .work/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name "grifo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json laws
          git commit -m "Atualizar leis ($(date +%F))"
          git push
      - name: Report failures
        if: steps.publish.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Leis não publicadas em $(date +%F)" --body-file .work/report.md
